<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Aula STT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#000;--red:#e3202b;--red-d:#9c141c;--fg:#fff;--mute:#8a8a8a;--line:#2a2a2a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.01em}
#status{font-size:14px;color:var(--mute)}
#status.live{color:var(--red)}
#text{flex:1;overflow-y:auto;padding:20px 18px;max-width:70ch;width:100%;margin:0 auto}
#text p{margin:0 0 .9em}
#text .part{color:var(--mute)}
#empty{color:var(--mute)}
footer{display:flex;align-items:center;justify-content:center;gap:22px;padding:16px 18px 22px;border-top:1px solid var(--line)}
button{font:inherit;color:var(--fg);cursor:pointer;border:0}
.ic{width:52px;height:52px;border-radius:50%;background:#111;border:1px solid var(--red);display:grid;place-items:center}
.ic:active{background:var(--red-d)}
.ic svg,#rec svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#rec{width:84px;height:84px;border-radius:50%;background:var(--red);display:grid;place-items:center;
  box-shadow:0 0 0 calc(4px + var(--lv,0)*26px) rgba(227,32,43,.28);transition:box-shadow .08s}
#rec svg{width:34px;height:34px}
#rec:active{background:var(--red-d)}
#rec.on{background:#fff}
#rec.on svg{stroke:var(--red);fill:var(--red)}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
dialog{background:#0c0c0c;color:var(--fg);border:1px solid var(--red);border-radius:14px;padding:20px;width:min(92vw,440px)}
dialog::backdrop{background:rgba(0,0,0,.8)}
label{display:block;font-size:14px;color:var(--mute);margin:14px 0 6px}
input,select{width:100%;font:inherit;padding:11px;border-radius:8px;border:1px solid var(--line);background:#000;color:#fff}
.btn{margin-top:18px;width:100%;padding:12px;border-radius:10px;background:var(--red);font-weight:600}
small{display:block;color:var(--mute);margin-top:6px;font-size:13px}
#dl{display:block;margin:10px auto 0;color:var(--red);font-size:15px;text-align:center}
</style>
</head>
<body>
<header><h1>Aula STT</h1><span id="status">Pronto</span></header>
<main id="text" aria-live="polite"><p id="empty">Premi il pulsante rosso per iniziare a trascrivere la lezione.</p></main>
<footer>
  <button class="ic" id="copy" aria-label="Copia testo"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button>
  <button id="rec" aria-label="Avvia o ferma"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button class="ic" id="set" aria-label="Impostazioni"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
</footer>
<a id="dl" hidden>Scarica audio originale</a>

<dialog id="dlg">
  <strong>Impostazioni</strong>
  <label for="srv">Indirizzo del server (wss://...)</label>
  <input id="srv" placeholder="vuoto = riconoscimento del browser (solo test)" autocapitalize="off" spellcheck="false">
  <small>Il server arriva nel passo successivo. Finché è vuoto, l'app usa il riconoscimento vocale integrato del browser per provare l'interfaccia.</small>
  <label for="lang">Lingua</label>
  <select id="lang"><option value="it">Italiano</option><option value="en">English</option></select>
  <button class="btn" id="save">Salva</button>
</dialog>

<script>
const $=id=>document.getElementById(id);
const st={srv:"",lang:"it"};
try{Object.assign(st,JSON.parse(localStorage.getItem("cfg")||"{}"))}catch(e){}
let ws,ctx,stream,rec,chunks=[],recog,wake,running=false;

const status=(t,live)=>{$("status").textContent=t;$("status").className=live?"live":""};
function addFinal(t){
  if(!t.trim())return;$("empty")?.remove();
  $("text").querySelector(".part")?.remove();
  const p=document.createElement("p");p.textContent=t.trim();$("text").appendChild(p);$("text").scrollTop=1e9;
}
function setPartial(t){
  $("empty")?.remove();
  let p=$("text").querySelector(".part");
  if(!p){p=document.createElement("p");p.className="part";$("text").appendChild(p)}
  p.textContent=t;$("text").scrollTop=1e9;
}

async function start(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false,noiseSuppression:false,autoGainControl:true,channelCount:1}});
  }catch(e){status("Microfono non consentito");return}
  running=true;$("rec").classList.add("on");status("In ascolto",true);$("dl").hidden=true;
  try{wake=await navigator.wakeLock?.request("screen")}catch(e){}
  // registra sempre l'audio originale
  chunks=[];try{rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=saveAudio;rec.start(1000)}catch(e){}
  if(st.srv) await startServer(); else startBrowser();
}

async function startServer(){
  status("Connessione al server...",true);
  ws=new WebSocket(st.srv);ws.binaryType="arraybuffer";
  ws.onopen=()=>{ws.send(JSON.stringify({type:"config",lang:st.lang,sampleRate:16000}));status("In ascolto",true);pipe()};
  ws.onmessage=e=>{try{const m=JSON.parse(e.data);m.type==="final"?addFinal(m.text):setPartial(m.text)}catch(_){}};
  ws.onerror=()=>status("Server non raggiungibile");
  ws.onclose=()=>{if(running)status("Connessione persa (audio in registrazione)")};
}

function pipe(){
  ctx=new AudioContext();const src=ctx.createMediaStreamSource(stream);
  const proc=ctx.createScriptProcessor(4096,1,1);
  const ratio=ctx.sampleRate/16000;
  proc.onaudioprocess=e=>{
    const x=e.inputBuffer.getChannelData(0);
    let s=0;for(let i=0;i<x.length;i++)s+=x[i]*x[i];
    $("rec").style.setProperty("--lv",Math.min(1,Math.sqrt(s/x.length)*6));
    if(ws?.readyState!==1)return;
    const n=Math.floor(x.length/ratio),out=new Int16Array(n);
    for(let i=0;i<n;i++){const v=Math.max(-1,Math.min(1,x[Math.floor(i*ratio)]));out[i]=v<0?v*32768:v*32767}
    ws.send(out.buffer);
  };
  src.connect(proc);proc.connect(ctx.destination);
}

function startBrowser(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){status("Riconoscimento del browser non disponibile");return}
  recog=new SR();recog.lang=st.lang==="it"?"it-IT":"en-US";recog.continuous=true;recog.interimResults=true;
  recog.onresult=e=>{let part="";for(let i=e.resultIndex;i<e.results.length;i++){
    const r=e.results[i];r.isFinal?addFinal(r[0].transcript):part+=r[0].transcript}
    if(part)setPartial(part)};
  recog.onend=()=>{if(running)try{recog.start()}catch(e){}};
  recog.start();
}

function stop(){
  running=false;$("rec").classList.remove("on");$("rec").style.removeProperty("--lv");status("Pronto");
  try{recog?.stop()}catch(e){}try{ws?.close()}catch(e){}try{rec?.state!=="inactive"&&rec.stop()}catch(e){}
  stream?.getTracks().forEach(t=>t.stop());ctx?.close();wake?.release?.();
}
function saveAudio(){
  if(!chunks.length)return;const b=new Blob(chunks,{type:chunks[0].type});
  const a=$("dl");a.href=URL.createObjectURL(b);
  a.download="lezione-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+(b.type.includes("mp4")?".m4a":".webm");a.hidden=false;
}

$("rec").onclick=()=>running?stop():start();
$("copy").onclick=async()=>{
  const t=[...$("text").querySelectorAll("p:not(.part):not(#empty)")].map(p=>p.textContent).join("\n\n");
  try{await navigator.clipboard.writeText(t);status("Testo copiato")}catch(e){status("Copia non riuscita")}
};
$("set").onclick=()=>{$("srv").value=st.srv;$("lang").value=st.lang;$("dlg").showModal()};
$("save").onclick=()=>{st.srv=$("srv").value.trim();st.lang=$("lang").value;
  try{localStorage.setItem("cfg",JSON.stringify(st))}catch(e){}$("dlg").close()};

if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
